<script>
    // comparing while and for loops in JavaScript

    let a = ["rutu", "sagar", "pratik", "snehal", "shubham"];

    // for loop
    console.log("For Loop:");
    for (let i = 0; i < a.length; i++) {
        console.log(a[i]);
    }
console.log("or");
    // while loop
    console.log("While Loop:");
    let i = 0;
    while (i < a.length) {
        console.log(a[i]);
        i++;
    }
</script>
