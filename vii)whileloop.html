<script>
    // the while loop is used to execute a block of code as long as a specified condition is true.

    let a =["rutu", "sagar", "pratik", "snehal", "shubham"];
    var i = 0;
    while (i < a.length) {
        console.log(a[i]);// its show the length of array and print the value of array one by one.
        i++;
    }
    /* here syntax of while loop is used,
     the condition is checked before executing the block of code,
      if the condition is true then the block of code will be executed,
       if the condition is false then the block of code will not be executed. */

       //another example of while loop is
       while(i<10){
        console.log(i);
        i++;
       }
</script>
