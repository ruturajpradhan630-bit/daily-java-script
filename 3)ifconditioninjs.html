<script>
    // example of if condition in JavaScript
    let age = 18;
    if (age >= 18) {
        console.log("You are eligible to vote.");
    } else {
        console.log("You are not eligible to vote.");
    }
    //example of if-else if condition in JavaScript
    let marks = 85;
    if (marks >= 90) {
        console.log("Grade: A");
    } else if (marks >= 80) {
        console.log("Grade: B");
    } else if (marks >= 70) {
        console.log("Grade: C");
    } else {
        console.log("Grade: D");
    }
    //example of nested if condition in JavaScript
    let num = 10;
    if (num > 0) {
        if (num % 2 === 0) {
            console.log("The number is positive and even.");
        } else {
            console.log("The number is positive and odd.");
        }
    } else {
        console.log("The number is not positive.");
    }
    
</script>
