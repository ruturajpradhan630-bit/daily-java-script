<script>

    //there are some of boolean operators in javascript like &&, ||, !, ==, ===, !=, !==
    let a = true;
    let b = false; 
    console.log(a && b); // logical AND operator
    console.log(a || b); // logical OR operator
    console.log(!a); // logical NOT operator
    console.log(a == b); // equal to operator
    console.log(a === b); // equal value and equal type operator
    console.log(a != b); // not equal operator
    console.log(a !== b); // not equal value or not equal type operator
</script>
