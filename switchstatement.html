<script>
    let day = "Monday";
    switch (day) {
        case "Monday":// code to be executed if day is Monday
            console.log("It's Monday.");
            break;
        case "Tuesday":
            console.log("It's Tuesday.");
            break;
        case "Wednesday":
            console.log("It's Wednesday.");
            break;
        default:// code to be executed if day is not Monday, Tuesday, or Wednesday and is not a weekday
            console.log("It's not a weekday.");
    }
    /*The break Keyword
When JavaScript reaches a break keyword, it breaks out of the switch block.

This will stop the execution inside the switch block.

No more statements in the switch block will be executed.

It is not necessary to break the last case. The switch ends (breaks) there anyway*/
</script>
