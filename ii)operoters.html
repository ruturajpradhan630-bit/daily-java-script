<script>
// there are some operators in javascript like +, -, *, /, %, ++, --, =, ==, ===, !=, !==, >, <, >=, <=, &&, ||, !
let x =10;

let y = 20;
console.log(x + y); // addition operator
console.log(x - y); // subtraction operator
console.log(x * y); // multiplication operator
console.log(x / y); // division operator
console.log(x % y); // modulus operator
console.log(x++); // increment operator
console.log(x--); // decrement operator
console.log(x = y); // assignment operator
console.log(x == y); // equal to operator
console.log(x === y); // equal value and equal type operator
console.log(x != y); // not equal operator
console.log(x !== y); // not equal value or not equal type operator
console.log(x > y); // greater than operator
console.log(x < y); // less than operator
console.log(x >= y); // greater than or equal to operator
console.log(x <= y); // less than or equal to operator
console.log(x && y); // logical AND operator
console.log(x || y); // logical OR operator
console.log(!x); // logical NOT operator    
console.log("x = y"); // assignment operator
console.log("x -= y"); // subtraction assignment operator
console.log("x *= y"); // multiplication assignment operator
console.log("x /= y"); // division assignment operator
console.log("x %= y"); // modulus assignment operator
console.log("x **= y"); // exponentiation assignment operator
console.log("x &= y"); // bitwise AND assignment operator
console.log("x |= y"); // bitwise OR assignment operator
console.log("x ^= y"); // bitwise XOR assignment operator
console.log("x <<= y"); // left shift assignment operator
console.log("x >>= y"); // right shift assignment operator
console.log("x >>>= y"); // unsigned right shift assignment operator
// there are some of operator which is used in java scpipt
</script>
