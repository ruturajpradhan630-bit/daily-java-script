<script>
    // break statement is used to terminate the loop or switch statement and transfer program control to the statement following the terminated statement.

    //break in loop
    let a = ["rutu", "sagar", "pratik", "snehal", "shubham"];
    for (let i = 0; i < a.length; i++) {
        if (a[i] === "pratik") {
            break; // when the value of a[i] is "pratik", the loop will terminate and control will be transferred to the statement following the loop.
        }
        console.log(a[i]);
    }
    //break in switch statement
    let day = 3;
    switch (day) {
        case 1:
            console.log("Monday"); 
            break;
        case 2:
            console.log("Tuesday");
            break;
        case 3:
            console.log("Wednesday");
            break;
        case 4:
            console.log("Thursday");
            break;
        case 5:
            console.log("Friday");
            break;
        case 6:
            console.log("Saturday");
            break;
        case 7:
            console.log("Sunday");
            break;
        default:
            console.log("Invalid day");
    }
</script>
